name: Hardened runtime check

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-build:
    name: Frontend frozen install and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: yarn

      - name: Enable Yarn
        run: corepack enable

      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --ignore-scripts --non-interactive

      - name: Build static frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: yarn build
